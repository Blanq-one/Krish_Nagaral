<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="NexusFlow MCP Server for n8n - Automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="55%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#1db954" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#1db954" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1db954" stop-opacity="0"/>
    </radialGradient>
    <pattern id="neural" x="0" y="0" width="110" height="110" patternUnits="userSpaceOnUse">
      <circle cx="55" cy="55" r="1.6" fill="#1db954" opacity="0.5"/>
      <circle cx="10" cy="10" r="1.1" fill="#1db954" opacity="0.35"/>
      <circle cx="100" cy="10" r="1.1" fill="#1db954" opacity="0.35"/>
      <circle cx="10" cy="100" r="1.1" fill="#1db954" opacity="0.35"/>
      <circle cx="100" cy="100" r="1.1" fill="#1db954" opacity="0.35"/>
      <line x1="55" y1="55" x2="10" y2="10" stroke="#1db954" stroke-width="0.4" opacity="0.22"/>
      <line x1="55" y1="55" x2="100" y2="10" stroke="#1db954" stroke-width="0.4" opacity="0.22"/>
      <line x1="55" y1="55" x2="10" y2="100" stroke="#1db954" stroke-width="0.4" opacity="0.22"/>
      <line x1="55" y1="55" x2="100" y2="100" stroke="#1db954" stroke-width="0.4" opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#neural)" opacity="0.5"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- workflow graph motif -->
  <g fill="none" stroke="#1db954" stroke-width="2.5" stroke-linecap="round" opacity="0.75">
    <path d="M542 220 C575 220 575 160 608 160"/>
    <path d="M542 220 C575 220 575 280 608 280"/>
    <path d="M652 160 C683 160 683 220 713 220"/>
    <path d="M652 280 C683 280 683 220 713 220"/>
  </g>
  <g fill="#1db954">
    <circle cx="542" cy="220" r="4"/>
    <circle cx="608" cy="160" r="4"/>
    <circle cx="608" cy="280" r="4"/>
    <circle cx="652" cy="160" r="4"/>
    <circle cx="652" cy="280" r="4"/>
    <circle cx="713" cy="220" r="4"/>
  </g>
  <g fill="#1db954" fill-opacity="0.14" stroke="#1db954" stroke-opacity="0.8" stroke-width="1.5">
    <rect x="498" y="198" width="44" height="44" rx="10"/>
    <rect x="608" y="138" width="44" height="44" rx="10"/>
    <rect x="608" y="258" width="44" height="44" rx="10"/>
    <rect x="713" y="198" width="44" height="44" rx="10"/>
  </g>
  <g fill="#1ed760">
    <path d="M514 210 L530 220 L514 230 Z"/>
    <circle cx="630" cy="160" r="6"/>
    <circle cx="630" cy="280" r="6"/>
    <rect x="726" y="211" width="18" height="18" rx="3"/>
  </g>

  <!-- category pill -->
  <g transform="translate(56, 70)">
    <rect x="0" y="0" rx="16" ry="16" width="128" height="32" fill="#1db954" fill-opacity="0.14" stroke="#1db954" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#1db954"/>
    <text x="34" y="21" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1ed760" letter-spacing="0.5">Automation</text>
  </g>

  <!-- title -->
  <text x="56" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">NexusFlow</text>
  <text x="56" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#b3b3b3" letter-spacing="-0.5">MCP Server for n8n</text>

  <!-- accent underline -->
  <rect x="58" y="340" width="84" height="5" rx="2.5" fill="#1db954"/>

  <text x="744" y="416" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" opacity="0.45">Krish Nagaral</text>
</svg>
